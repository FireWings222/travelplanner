<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0}</style></head><body><title>TravelPlanner 홈 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 배치: 위쪽 조작 막대(시안, 기기) 아래 고정 높이 틀에 앱 화면을 그림. 틀은 container query로 데스크톱과 모바일 배치를 바꿈.
   값은 저장소 DESIGN.md(라이트 테마 하나, 원본 초록)를 그대로 씀 */
:root {
  --brand: #146748; --brand-on: #ffffff;
  --ink: #15171c; --ink-2: #454a54; --ink-3: #6a707c;
  --paper: #ffffff; --field: #f0f1f4; --field-2: #e2e4e9; --rule: #d0d3d9;
  --sel: #15171c; --flash: #dcefe3; --warn: #a14a00; --over: #c92a2a;
  --m-rail: #0d6fc4; --m-air: #146748; --m-bus: #d43d2a; --m-road: #a87900;
  --frame-edge: #b4b8c1;
  --float-shadow: 0 2px 10px rgb(18 24 38 / 18%), 0 1px 2px rgb(18 24 38 / 12%);
  --callout-shadow: 0 1px 3px rgb(18 24 38 / 30%);
  --lift-shadow: 0 1px 2px rgb(18 24 38 / 16%);
  --sheet-shadow: 0 -4px 14px rgb(18 24 38 / 16%);
  --font: "Pretendard Variable", Pretendard, Inter, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.intro h1 { font-size: clamp(22px, 3vw, 28px); font-weight: 800; margin: 0 0 8px; line-height: 1.3; text-wrap: balance; }
.intro p { margin: 0; color: var(--ink-2); max-width: 72ch; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; margin: 20px 0 10px; }
.controls > div { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pick-label { font-size: 14px; color: var(--ink-2); font-weight: 700; }
.pick { display: inline-flex; border: 1px solid var(--ink); border-radius: 8px; overflow: hidden; }
.pick button { border: 0; background: var(--paper); padding: 7px 13px; cursor: pointer; font-size: 15px; font-weight: 600; }
.pick button + button { border-left: 1px solid var(--ink); }
.pick button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.note { font-size: 15px; color: var(--ink-2); margin: 0 0 14px; max-width: 110ch; }
.note b { color: var(--ink); }
.stage { display: flex; justify-content: center; }
.frame { width: 100%; height: 800px; border: 1px solid var(--frame-edge); border-radius: 12px; overflow: hidden; container-type: inline-size;
  background: var(--field); position: relative; box-shadow: var(--float-shadow); }
.stage[data-device="mobile"] .frame { width: 390px; max-width: 100%; height: 820px; border-radius: 30px; border: 6px solid var(--ink); }

/* ---------- 앱 공통 ---------- */
.app { height: 100%; display: flex; flex-direction: column; font-size: 15px; line-height: 1.45; word-break: keep-all; color: var(--ink); }
.num { font-variant-numeric: tabular-nums; }
.topbar { display: flex; align-items: stretch; gap: 20px; padding: 0 20px; min-height: 62px; background: var(--paper); flex: none; position: relative; z-index: 4; }
.logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 19px; letter-spacing: -0.02em; white-space: nowrap; }
.logo em { font-style: normal; color: var(--brand); }
.logo .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--brand); display: grid; place-items: center; }
.logo .mark i { width: 14px; height: 14px; border: 1.5px solid var(--brand-on); border-radius: 50%; display: grid; place-items: center; }
.logo .mark i::before { content: ""; width: 5px; height: 8px; background: var(--brand-on); clip-path: polygon(50% 0, 100% 100%, 50% 79%, 0 100%); transform: rotate(35deg); }
.steps { display: flex; gap: 22px; margin-left: auto; }
.step { display: inline-flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 600; color: var(--ink-3); white-space: nowrap;
  border-top: 3px solid transparent; border-bottom: 3px solid transparent; }
.step i { font-style: normal; font-weight: 700; }
.step.now { color: var(--ink); font-weight: 800; border-bottom-color: var(--brand); }
.step.now i { color: var(--brand); }
.saved { align-self: center; font-size: 14px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.mi { flex: none; display: inline-block; vertical-align: -3px; }
.icons { display: inline-flex; gap: 3px; align-items: center; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; line-height: 1.3; padding: 2px 6px; border-radius: 4px; background: var(--ink); color: var(--paper); white-space: nowrap; }
.tag.low { background: var(--brand); color: var(--brand-on); }
.primary { border: 0; background: var(--brand); color: var(--brand-on); border-radius: 10px; padding: 9px 15px; font-size: 15px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.textbtn { border: 0; background: transparent; padding: 0; color: var(--brand); font-size: 14px; font-weight: 700; cursor: pointer; }
.fine { font-size: 13px; color: var(--ink-3); margin: 0; }
.swap { width: 34px; height: 34px; border: 1px solid var(--ink-3); border-radius: 8px; background: var(--paper); display: grid; place-items: center; cursor: pointer; color: var(--ink); flex: none; }
.swap:hover { border-color: var(--ink); }
.stepper { display: inline-flex; align-items: center; gap: 10px; }
.stepper button { width: 32px; height: 32px; border: 1px solid var(--ink-3); border-radius: 8px; background: var(--paper); cursor: pointer; font-size: 18px; font-weight: 600; line-height: 1; display: grid; place-items: center; }
.stepper button:disabled { color: var(--ink-3); border-color: var(--field-2); cursor: default; }
.stepper b { min-width: 18px; text-align: center; font-size: 16px; }
.plain-select { appearance: none; border: 0; background: transparent; padding: 0 18px 0 0; font-weight: 700; font-size: 16px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position: calc(100% - 7px) 55%, calc(100% - 2px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
.plain-date { border: 0; background: transparent; padding: 0; font-weight: 700; font-size: 15px; width: 132px; }
.box-input { width: 100%; border: 1px solid var(--ink-3); border-radius: 8px; background: var(--paper); padding: 7px 10px; min-height: 38px; }
.lbl { display: grid; gap: 4px; font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
.toast { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px;
  font-size: 14.5px; font-weight: 600; z-index: 9; max-width: calc(100% - 32px); box-shadow: var(--float-shadow); }
@keyframes flashbg { from { background-color: var(--flash); } to { background-color: transparent; } }
.flash { animation: flashbg 1.2s ease-out both; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- 시안 A: 검색 상자형 ---------- */
.va .scroll { flex: 1; min-height: 0; overflow: auto; }
.va .inner { max-width: 1080px; margin: 0 auto; padding: 30px 24px 40px; display: grid; gap: 14px; }
.va .head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.va h1 { margin: 0; font-size: 26px; font-weight: 800; line-height: 1.3; }
.va .head p { margin: 4px 0 0; color: var(--ink-2); font-size: 15px; }
.va .search { background: var(--paper); border-radius: 12px; padding: 8px; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1.25fr) minmax(0, .8fr) auto; gap: 8px; position: relative; }
.va .cell { background: var(--field); border-radius: 10px; padding: 8px 14px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.va .cell small { font-size: 11.5px; font-weight: 700; color: var(--ink-3); }
.va .route { flex-direction: row; align-items: center; gap: 10px; }
.va .route > div { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.va .dates { flex-direction: row; align-items: center; gap: 8px; flex-wrap: wrap; }
.va .dates > div { display: flex; flex-direction: column; }
.va .dates .nights { margin-left: auto; font-size: 13.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.va .party { cursor: pointer; border: 0; text-align: left; }
.va .party b { font-size: 16px; }
.va .search .primary { padding: 0 22px; font-size: 16px; min-height: 56px; }
.va .pop { position: absolute; top: calc(100% + 6px); right: 150px; width: 270px; background: var(--paper); border-radius: 12px; box-shadow: var(--float-shadow); padding: 14px 16px; display: grid; gap: 12px; z-index: 5; }
.va .pop .row { display: flex; justify-content: space-between; align-items: center; }
.va .pop .row span small { display: block; font-size: 12.5px; color: var(--ink-3); }
.va .opt { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 14px; color: var(--ink-2); padding: 0 4px; }
.va .optgrid { background: var(--paper); border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.va .optgrid .fine { grid-column: 1 / -1; }
.va h2 { margin: 12px 4px 0; font-size: 17px; font-weight: 800; }
.va .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.va .dest { border: 0; text-align: left; background: var(--paper); border-radius: 12px; padding: 16px; display: grid; gap: 6px; cursor: pointer; align-content: start; }
.va .dest:hover { box-shadow: inset 0 0 0 1px var(--ink-3); }
.va .dest[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--sel); }
.va .dest.from { cursor: default; background: transparent; box-shadow: inset 0 0 0 1px var(--field-2); }
.va .dest .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.va .dest .city { font-size: 20px; font-weight: 800; }
.va .dest .cap { font-size: 13.5px; color: var(--ink-2); }
.va .dest .price { font-size: 22px; font-weight: 800; color: var(--brand); line-height: 1.25; }
.va .dest .meta { display: flex; align-items: center; gap: 8px; font-size: 14.5px; flex-wrap: wrap; }
.va .dest .fast { font-size: 14px; color: var(--ink-2); }
.va .dest .sights { margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 14px; color: var(--ink-2); }
.va .dest .sights b { color: var(--ink); font-weight: 700; }
.va .dest.from .city { color: var(--ink-2); }

/* ---------- 시안 B: 지도 분할형 ---------- */
.vb .body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(380px, 440px) minmax(0, 1fr); position: relative; }
.vb .listpane { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 12px 16px 16px; }
.vb .sheethandle { display: none; }
.vb .listhead { padding: 20px 4px 6px; }
.vb .listhead h1 { font-size: 21px; font-weight: 800; margin: 0 0 2px; line-height: 1.3; }
.vb .listhead p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.vb .card { background: var(--paper); border-radius: 12px; padding: 4px 16px; flex: none; }
.vb .line { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-height: 52px; }
.vb .line + .line { border-top: 1px solid var(--rule); }
.vb .line > small { width: 52px; font-size: 13.5px; font-weight: 700; color: var(--ink-2); flex: none; }
.vb .line .grow { flex: 1; min-width: 0; }
.vb .routecard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; padding: 13px 16px; border: 0; border-radius: 12px; background: var(--paper); cursor: pointer; text-align: left; width: 100%; flex: none; }
.vb .routecard:hover { box-shadow: inset 0 0 0 1px var(--ink-3); }
.vb .routecard[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--sel); }
.vb .rc-title { font-size: 16px; font-weight: 600; }
.vb .routecard[aria-pressed="true"] .rc-title { font-weight: 800; }
.vb .rc-price { font-size: 17px; font-weight: 700; color: var(--brand); text-align: right; white-space: nowrap; }
.vb .rc-meta { display: flex; align-items: center; gap: 9px; font-size: 14.5px; flex-wrap: wrap; }
.vb .rc-sub { font-size: 13.5px; color: var(--ink-2); text-align: right; white-space: nowrap; align-self: center; }
.vb .sectlabel { margin: 8px 4px 0; font-size: 14px; font-weight: 800; color: var(--ink-2); }
.vb details.card { padding: 12px 16px; }
.vb details summary { font-weight: 700; font-size: 15px; cursor: pointer; }
.vb details .optgrid { display: grid; gap: 10px; margin-top: 10px; }
.vb .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 4px 0; }
.vb .mappane { position: relative; min-height: 0; margin: 12px 12px 12px 0; border-radius: 14px; overflow: hidden; background: #a7d4ea; }
.vb .mapimg { position: absolute; inset: 0; background-repeat: no-repeat; }
.vb .layer { position: absolute; inset: 0; pointer-events: none; }
.vb .layer svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.vb .kpt { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; border: 0; padding: 0; background: transparent; }
.vb .knode { width: 15px; height: 15px; border-radius: 50%; background: var(--paper); border: 3.5px solid var(--ink); display: block; }
.vb .kdim { width: 13px; height: 13px; border-radius: 50%; background: var(--paper); border: 2.5px solid var(--ink-2); display: block; }
.vb .kpin { transform: translate(-50%, -100%); }
.vb .kpin svg { display: block; filter: drop-shadow(var(--callout-shadow)); }
.vb .kc { position: absolute; background: var(--paper); color: var(--ink); border-radius: 7px; padding: 5px 10px 6px; box-shadow: var(--callout-shadow); font: 700 13px/1.35 var(--font); white-space: nowrap; pointer-events: auto; cursor: pointer; transform: translate(14px, -50%); }
.vb .kc small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); }
.vb .kc.dim { font-weight: 600; color: var(--ink-2); }
.vb .kc.flip { transform: translate(calc(-100% - 14px), -50%); }
.vb .kplane { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; box-shadow: var(--callout-shadow); transform: translate(-50%, -50%); }
.vb .mapnote { position: absolute; left: 8px; top: 8px; z-index: 2; background: var(--paper); color: var(--ink-2); font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 4px; box-shadow: var(--callout-shadow); }
.vb .estimate { position: absolute; right: 26px; bottom: 26px; width: 292px; background: var(--paper); border-radius: 12px; box-shadow: var(--float-shadow); padding: 16px 18px; z-index: 3; }
.vb .est-main { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; align-items: baseline; }
.vb .est-label { font-size: 14px; font-weight: 700; color: var(--ink-2); }
.vb .est-pct { font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.vb .est-sum { grid-column: 1 / -1; font-size: 31px; font-weight: 800; line-height: 1.25; letter-spacing: -0.01em; }
.vb .bar { grid-column: 1 / -1; margin: 8px 0 6px; height: 8px; background: var(--field-2); border-radius: 2px; overflow: hidden; }
.vb .bar i { display: block; height: 100%; background: var(--brand); transition: width .62s cubic-bezier(.33,1,.68,1); }
.vb .est-left { grid-column: 1 / -1; margin: 0; font-size: 13.5px; color: var(--ink-2); }
.vb .est-left b { color: var(--ink); }
.vb .detail { margin-top: 12px; border-top: 1px solid var(--rule); padding-top: 8px; }
.vb .detail .r { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; padding: 4px 6px; margin-inline: -6px; border-radius: 4px; }
.vb .detail .r span:first-child { color: var(--ink-2); }
.vb .detail .r span:last-child { font-weight: 600; white-space: nowrap; }
.vb .detail .fine { margin-top: 8px; }
.vb .est-toggle { display: none; }

@container (max-width: 860px) {
  .topbar { flex-wrap: wrap; gap: 0 10px; padding: 10px 14px 0; min-height: 0; }
  .logo .mark { width: 34px; height: 34px; border-radius: 9px; }
  .steps { margin-left: 0; width: 100%; gap: 18px; height: 40px; margin-top: 6px; }
  .step span { display: none; }
  .step.now span { display: inline; }
  .saved { display: none; }
  .va .inner { padding: 18px 14px 28px; }
  .va h1 { font-size: 21px; }
  .va .search { grid-template-columns: 1fr; }
  .va .search .primary { min-height: 48px; }
  .va .pop { right: 8px; left: 8px; width: auto; top: auto; bottom: 64px; }
  .va .optgrid { grid-template-columns: 1fr; }
  .va .cards { grid-template-columns: 1fr; }
  .va .dest.from { display: none; }
  .vb .body { display: flex; flex-direction: column; }
  .vb .mappane { flex: none; height: 300px; order: -1; margin: 0; border-radius: 0; }
  .vb .listpane { flex: 1; padding: 0 14px; border-radius: 18px 18px 0 0; margin-top: -18px; position: relative; z-index: 2; background: var(--field); box-shadow: var(--sheet-shadow); }
  .vb .listhead { padding-top: 6px; }
  .vb .sheethandle { display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--ink-3); margin: 9px auto 0; flex: none; }
  .vb .estimate { position: relative; right: auto; bottom: auto; width: auto; border-radius: 0; box-shadow: 0 -1px 0 var(--rule), var(--sheet-shadow); padding: 12px 16px 14px; }
  .vb .est-main { grid-template-columns: auto 1fr auto; align-items: center; }
  .vb .est-sum { grid-column: auto; font-size: 23px; text-align: right; }
  .vb .est-pct { display: none; }
  .vb .est-toggle { display: inline; }
  .vb .detail { display: none; }
  .vb .estimate.open .detail { display: block; }
  .vb .mapnote { top: auto; bottom: 26px; }
}
</style>

<div class="wrap">
  <div class="intro">
    <h1>TravelPlanner 홈(여행 조건) 시안 A, B</h1>
    <p>1단계 여행 조건 화면 시안이야. 색, 글꼴, 컴포넌트는 DESIGN.md 값을 그대로 썼고, 금액과 시간은 실행 중인 앱의 경로 비교 API에서 받은 성인 2명 기준 샘플 운임이야. 입력, 맞바꾸기, 인원 버튼, 목적지 고르기는 눌러 볼 수 있어.</p>
  </div>
  <div class="controls">
    <div><span class="pick-label">시안</span><span class="pick" id="ctl-variant"><button type="button" data-v="a" aria-pressed="true">A 검색 상자형</button><button type="button" data-v="b" aria-pressed="false">B 지도 분할형</button></span></div>
    <div><span class="pick-label">기기</span><span class="pick" id="ctl-device"><button type="button" data-d="desktop" aria-pressed="true">데스크톱</button><button type="button" data-d="mobile" aria-pressed="false">모바일</button></span></div>
  </div>
  <p class="note" id="note"></p>
  <div class="stage" id="stage" data-device="desktop"><div class="frame" id="frame"></div></div>

// 지도 그림을 지도 칸에 맞추고(견적 카드가 가리는 만큼 왼쪽으로), 도시 점, 핀, 이름표, 최저 경로 선을 그 위에 올림
function placeMap() {
  const pane = frame.querySelector('.mappane'); if (!pane) return;
  const w = pane.clientWidth, h = pane.clientHeight, card = narrow() ? 0 : 330;
  const s = narrow() ? Math.max(w / MAP_W, h / MAP_H) : Math.max(w / MAP_W, h / MAP_H, (w - card) / 560);
  const cx = 503, cy = 430;
  let ox = (w - card) / 2 - cx * s, oy = h / 2 - cy * s;
  ox = Math.min(0, Math.max(w - MAP_W * s, ox)); oy = Math.min(0, Math.max(h - MAP_H * s, oy));
  const img = frame.querySelector('#mapimg');
  img.style.backgroundImage = 'url(' + MAP_SRC + ')';
  img.style.backgroundSize = (MAP_W * s) + 'px ' + (MAP_H * s) + 'px';
  img.style.backgroundPosition = ox + 'px ' + oy + 'px';
  const at = k => [ox + PT[k][0] * s, oy + PT[k][1] * s];
  const r = route(), main = r.cheap[2].includes('FLIGHT') ? 'FLIGHT' : r.cheap[2][0];
  const color = 'var(--m-' + MODES[main][1] + ')';
  const [x0, y0] = at(state.origin), [x1, y1] = at(state.dest);
  let path, plane = '';
  if (main === 'FLIGHT') {
    const [ax, ay] = at(AIRPORT[state.origin]), [bx, by] = at(AIRPORT[state.dest]);
    const mx = (ax + bx) / 2 - (by - ay) * .18, my = (ay + by) / 2 + (bx - ax) * .18;
    path = 'M' + x0 + ' ' + y0 + ' L' + ax + ' ' + ay + ' Q' + mx + ' ' + my + ' ' + bx + ' ' + by + ' L' + x1 + ' ' + y1;
    const px = .25 * ax + .5 * mx + .25 * bx, py = .25 * ay + .5 * my + .25 * by;
    const ang = Math.atan2(by - ay, bx - ax) * 180 / Math.PI + 90;
    plane = '<span class="kplane" style="left:' + px + 'px;top:' + py + 'px"><svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" style="color:' + color + ';transform:rotate(' + ang.toFixed(0) + 'deg)" aria-hidden="true"><path d="' + PLANE + '"/></svg></span>';
  } else {
    path = 'M' + x0 + ' ' + y0 + ' Q' + ((x0 + x1) / 2 + 30) + ' ' + ((y0 + y1) / 2) + ' ' + x1 + ' ' + y1;
  }
  let html = '<svg aria-hidden="true"><path d="' + path + '" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>' + plane;
  Object.keys(CITY).forEach(k => {
    const [x, y] = at(k);
    if (k === state.origin) {
      html += '<span class="kpt" style="left:' + x + 'px;top:' + y + 'px"><span class="knode"></span></span><span class="kc" style="left:' + x + 'px;top:' + y + 'px">' + CITY[k].place + '<small>출발</small></span>';
    } else if (k === state.dest) {
      html += '<span class="kpt kpin" style="left:' + x + 'px;top:' + y + 'px"><svg width="24" height="31" viewBox="0 0 26 34" aria-hidden="true"><path d="M13 33.5C13 33.5 2.5 20.6 2.5 12.5a10.5 10.5 0 0 1 21 0c0 8.1-10.5 21-10.5 21z" fill="var(--brand)" stroke="#fff" stroke-width="1.5"/><circle cx="13" cy="12" r="3.6" fill="#fff"/></svg></span>'
        + '<span class="kc" style="left:' + x + 'px;top:' + y + 'px">' + CITY[k].place + '<small>편도 ' + mins(r.cheap[1]) + ', 1인 ' + won(r.cheap[0]) + '부터</small></span>';
    } else {
      const x2 = ROUTE[state.origin + '>' + k];
      html += '<button type="button" class="kpt" data-dest="' + k + '" style="left:' + x + 'px;top:' + y + 'px" aria-label="' + CITY[k].name + ' 고르기"><span class="kdim"></span></button>'
        + '<span class="kc dim" data-dest="' + k + '" style="left:' + x + 'px;top:' + y + 'px">' + CITY[k].name + ' ' + won(x2.cheap[0]) + '부터</span>';
    }
  });
  frame.querySelector('#layer').innerHTML = html;
  frame.querySelectorAll('#layer .kc').forEach(el => { if (parseFloat(el.style.left) + el.offsetWidth + 20 > w) el.classList.add('flip'); });
}

// 숫자 전환: 이전 값에서 새 값으로 620ms 동안 바뀜(DESIGN.md number-roll)
const rolled = {};
function roll() {
  frame.querySelectorAll('[data-roll]').forEach(el => {
    const key = el.dataset.roll, to = +el.dataset.val, from = rolled[key];
    rolled[key] = to;
    if (from === undefined || from === to || RM.matches) return;
    const suffix = el.textContent.endsWith('부터') ? '부터' : '';
    const t0 = performance.now();
    const step = now => { const t = Math.min(1, (now - t0) / 620); el.textContent = won(from + (to - from) * (1 - Math.pow(1 - t, 3))) + suffix; if (t < 1 && el.isConnected) requestAnimationFrame(step); };
    requestAnimationFrame(step);
    const row = frame.querySelector('[data-flash="t"]'); if (key === 'sum' && row) { row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); }
  });
}

const NOTES = {
  a: '<b>시안 A 검색 상자형</b>: Rome2Rio, KAYAK처럼 필수 조건(출발, 도착, 날짜, 인원)을 검색 상자 한 줄로 줄이고, 아래 목적지 카드에서 도시별 최저 운임과 시간, 가 볼 곳을 먼저 보여 줘. 예산, 선호 교통수단, 여행 유형은 "선택 조건"으로 접었어. 지도가 없어서 구현이 가장 가볍고, 다음 단계(지도 분할)와는 배치가 달라.',
  b: '<b>시안 B 지도 분할형</b>: 경로 비교, 여행 일정과 같은 왼쪽 목록, 오른쪽 카카오맵 배치야. 목적지를 목록이나 지도의 회색 점으로 고르면 최저 경로 선과 "여행 견적 미리 보기"(왕복 교통 최저 추정과 예산 비교)가 바로 바뀌어. 단계가 바뀌어도 화면 틀이 그대로라 흐름이 이어지지만, 홈에서도 카카오맵을 불러야 해. 지도 그림은 실제 카카오맵 캡처라 시안에서는 확대, 이동이 안 돼.'
};
function render() {
  frame.innerHTML = (state.variant === 'a' ? renderA() : renderB()) + (state.toast ? '<div class="toast" role="status">' + state.toast + '</div>' : '');
  document.getElementById('note').innerHTML = NOTES[state.variant] + ' 두 시안 공통: 출발지와 목적지 맞바꾸기, 인원 +, - 버튼, 큰 그림 영역과 눌리지 않는 예시 카드 제거(진단 9번).';
  const t = frame.querySelector('#f-type'); if (t) t.value = state.type;
  if (state.variant === 'b') placeMap();
  roll();
}
let toastTimer;
function toast(msg) { state.toast = msg; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { state.toast = ''; render(); }, 2200); }

frame.addEventListener('click', ev => {
  const d = ev.target.closest('[data-dest]');
  if (d && d.dataset.dest !== state.dest) { state.dest = d.dataset.dest; render(); return; }
  const s = ev.target.closest('[data-step]');
  if (s) { state[s.dataset.step] = Math.max(s.dataset.step === 'adults' ? 1 : 0, Math.min(9, state[s.dataset.step] + +s.dataset.d)); render(); return; }
  const a = ev.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'swap') { [state.origin, state.dest] = [state.dest, state.origin]; render(); }
  else if (act === 'party') { state.party = !state.party; render(); }
  else if (act === 'opt') { state.opt = !state.opt; render(); }
  else if (act === 'est') { state.open = !state.open; render(); }
  else if (act === 'sample') { Object.assign(state, {origin: 'seoul', dest: 'jeju', start: '2027-03-10', end: '2027-03-12', adults: 2, children: 0, budget: 450000, mode: '', type: 'COUPLE'}); toast('제주 샘플 조건을 채웠습니다.'); }
  else if (act === 'go') { toast(CITY[state.origin].name + '에서 ' + CITY[state.dest].name + ', ' + nights() + '박 ' + (nights() + 1) + '일 조건으로 이동 경로 화면으로 넘어갑니다.'); }
});
frame.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'f-origin') { if (el.value === state.dest) state.dest = state.origin; state.origin = el.value; }
  else if (el.id === 'f-dest') { if (el.value === state.origin) state.origin = state.dest; state.dest = el.value; }
  else if (el.id === 'f-start') { state.start = el.value; if (state.end < state.start) state.end = state.start; }
  else if (el.id === 'f-end') { state.end = el.value < state.start ? state.start : el.value; }
  else if (el.id === 'f-budget') { state.budget = el.value ? +el.value : null; }
  else if (el.id === 'f-mode') { state.mode = el.value; }
  else if (el.id === 'f-type') { state.type = el.value; return; }
  else return;
  render();
});
frame.addEventListener('toggle', ev => { if (ev.target.id === 'optbox') state.opt = ev.target.open; }, true);
document.getElementById('ctl-variant').addEventListener('click', ev => { const b = ev.target.closest('[data-v]'); if (!b) return; state.variant = b.dataset.v;
  document.querySelectorAll('#ctl-variant button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); render(); });
document.getElementById('ctl-device').addEventListener('click', ev => { const b = ev.target.closest('[data-d]'); if (!b) return; state.device = b.dataset.d;
  document.getElementById('stage').dataset.device = state.device;
  document.querySelectorAll('#ctl-device button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); render(); });
let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(render, 80); }).observe(frame);
render();
</script>
