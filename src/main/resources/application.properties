spring.application.name=travelplanner
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**
# 상대 경로로 가져오는 JS 모듈은 같은 버전 디렉터리를 사용합니다.
spring.web.resources.chain.strategy.fixed.enabled=true
spring.web.resources.chain.strategy.fixed.paths=/js/**
spring.web.resources.chain.strategy.fixed.version=20261124-6
spring.web.resources.cache.cachecontrol.no-cache=true
server.port=8080
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=jdbc:h2:file:./data/travelplanner;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
