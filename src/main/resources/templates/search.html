<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('경로 비교')}"></head>
<body data-page="routes" class="redesign map-screen">
<header th:replace="~{layout :: header('routes')}"></header>
<main id="main">
  <div class="split">
    <section class="listpane" aria-label="이동 경로 목록">
      <div class="sheethandle" aria-hidden="true"></div>
      <div class="listhead">
        <h1 id="route-title">이동 경로</h1>
        <p>카드를 누르면 지도와 견적이 바로 바뀝니다. 금액은 일행 편도 기준입니다.</p>
        <div id="route-sort" class="sort" role="group" aria-label="정렬" hidden>
          <button type="button" data-sort="rec" aria-pressed="true">추천순</button>
          <button type="button" data-sort="price" aria-pressed="false">최저가</button>
          <button type="button" data-sort="time" aria-pressed="false">최단 시간</button>
        </div>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div id="route-summary"></div>
      <div id="route-list" class="route-list"></div>
      <div class="list-foot">
        <p id="route-note" class="fine"></p>
        <p id="route-geometry-note" class="fine" role="status" hidden></p>
        <a class="textbtn" href="/">여행 조건 수정</a>
        <a class="primary" href="/itinerary">여행 일정 만들기</a>
      </div>
    </section>
    <!-- routes.js가 노선 지도와 견적을 채웁니다. 스타일에서 견적을 데스크톱 지도 위, 모바일 화면 아래에 배치합니다. -->
    <section class="mappane" aria-label="이동 경로 지도">
      <div id="route-map" class="mapslot"></div>
    </section>
    <aside id="estimate" class="estimate" aria-label="여행 견적" hidden></aside>
  </div>
</main>
</body>
</html>
