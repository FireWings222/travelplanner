<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('여행 일정')}"></head>
<body data-page="plan">
<header th:replace="~{layout :: header('plan')}"></header>
<main id="main">

  <div class="container workspace">
    <div id="trip-summary" class="trip-summary" hidden></div>
    <div class="page-title"><span class="eyebrow">일자별 계획</span><h1>여행 일정</h1><p>관광지의 방문 순서와 교통수단을 바꿔 일자별 예상 비용을 계산하세요.</p></div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    
    <div class="actions page-actions"><a class="soft" href="/search">경로 비교</a><button id="save-plan" class="soft" type="button" hidden>일정 저장</button><a class="primary" href="/tours">현지 일일투어 보기</a></div>
    <div id="plan-summary"></div><div id="plan-days"></div>
    <section class="panel section" id="saved"><h2>저장한 여행</h2><div id="saved-plans"></div></section>
  </div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
