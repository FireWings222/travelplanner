<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('여행 일정')}"></head>
<body data-page="plan" class="redesign map-screen">
<header th:replace="~{layout :: header('plan')}"></header>
<main id="main">
  <div class="split">
    <section class="listpane" aria-label="여행 일정">
      <div class="sheethandle" aria-hidden="true"></div>
      <div class="listhead">
        <h1 id="plan-title">현지 일정</h1>
        <p>장소 왼쪽 손잡이를 끌어서 순서를 바꾸세요.</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <!-- plan.js가 날짜 버튼과 선택한 날짜의 타임라인을 그립니다. 이동 구간은 서버 견적의 방문 순서를 따릅니다. -->
      <div id="plan-days" class="days" role="group" aria-label="날짜"></div>
      <section id="plan-opinions" aria-label="날짜별 의견" hidden>
        <div id="opinion-tabs" role="group" aria-label="일정 선택"></div>
        <form id="opinion-name" hidden>
          <label>의견 이름<input name="opinionName" maxlength="40" required></label>
          <button class="primary" type="submit">확인</button>
          <button class="textbtn" id="cancel-opinion-name" type="button">취소</button>
        </form>
        <div id="opinion-tools" hidden>
          <label><input id="compare-opinion" type="checkbox" checked> 기본 일정과 겹쳐 보기</label>
          <button class="textbtn" id="rename-opinion" type="button">이름 변경</button>
        </div>
      </section>
      <div id="plan-day"></div>
      <section id="related-tours" aria-labelledby="related-tours-heading" hidden>
        <h2 id="related-tours-heading">이 관광지를 방문하는 일일투어</h2>
        <p id="related-tours-status" class="fine" role="status"></p>
        <div id="related-tours-list"></div>
      </section>
      <div class="list-foot">
        <p id="plan-note" class="fine"></p>
        <p id="plan-geometry-note" class="fine" role="status" hidden></p>
        <a class="textbtn" href="/search">경로 비교로 돌아가기</a>
        <button id="save-plan" class="primary" type="button" hidden>일정 저장</button>
      </div>
      <details id="saved" class="saved">
        <summary>저장한 여행</summary>
        <div id="saved-plans"></div>
      </details>
    </section>
    <section class="mappane" aria-label="일정 지도">
      <div id="plan-map" class="mapslot"></div>
    </section>
    <aside id="estimate" class="estimate" aria-label="여행 견적" hidden></aside>
  </div>
  <dialog id="tour-preview" aria-labelledby="tour-preview-title">
    <div class="tour-preview-heading">
      <h2 id="tour-preview-title"></h2>
      <form method="dialog"><button class="outline" type="submit" autofocus>닫기</button></form>
    </div>
    <ol id="tour-preview-stops"></ol>
    <p id="tour-preview-note" class="fine" role="status"></p>
    <div id="tour-preview-map" aria-label="투어 관광지 방문 순서" hidden></div>
  </dialog>
</main>
</body>
</html>
