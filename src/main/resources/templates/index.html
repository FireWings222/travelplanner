<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('여행 검색')}"></head>
<body data-page="home">
<header th:replace="~{layout :: header('home')}"></header>
<main id="main">

  <section class="hero container">
    <div class="hero-text">
      <span class="eyebrow"><span class="eyebrow-line"></span> 국내여행 플래너</span>
      <h1>가까운 곳으로,<br><em>우리나라 여행.</em></h1>
      <p>목적지까지 가는 길부터 현지 일정까지.<br>이동 시간과 비용을 한곳에서 비교해 보세요.</p>
    </div>
  </section>
  <div class="container search-wrap">
    <section class="panel search-panel" aria-labelledby="search-heading">
      <div class="panel-heading"><div><h2 id="search-heading">어디로 떠나시나요?</h2><p>출발지와 목적지를 선택해 여행을 시작하세요.</p></div></div>
      <form id="trip-form">
        <div class="place-grid">
          <div class="trip-place">
            <label for="trip-origin">출발지</label>
            <div class="place-field"><input id="trip-origin" name="origin" list="city-list" placeholder="장소명 또는 주소"
                 required maxlength="160" autocomplete="off" aria-describedby="origin-place-status">
              <button type="button" class="soft" id="find-origin" aria-label="출발지 장소 찾기">장소 찾기</button></div>
            <p class="place-status" id="origin-place-status" role="status"></p>
            <ul class="place-results" id="origin-place-results" hidden></ul>
          </div>
          <div class="trip-place">
            <label for="trip-destination">목적지</label>
            <div class="place-field"><input id="trip-destination" name="destination" list="city-list" placeholder="장소명 또는 주소"
                 required maxlength="160" autocomplete="off" aria-describedby="destination-place-status">
              <button type="button" class="soft" id="find-destination" aria-label="목적지 장소 찾기">장소 찾기</button></div>
            <p class="place-status" id="destination-place-status" role="status"></p>
            <ul class="place-results" id="destination-place-results" hidden></ul>
          </div>
        </div>
        <div class="search-grid trip-dates">
          <label>여행 시작일<input type="date" name="start" required></label>
          <label>여행 종료일<input type="date" name="end" required></label>
          <label>성인<input name="adults" type="number" min="1" max="30" required></label>
          <label>아동<input name="children" type="number" value="0" min="0" max="30" required></label>
        </div>
        <datalist id="city-list"></datalist>
        <div class="search-bottom">
          <label>예산 (원)<input name="budget" type="number" min="0" max="999999999999" placeholder="선택 입력"></label>
          <label>선호 교통수단<select name="preferredMode" id="preferred-mode"></select></label>
          <label>여행 유형<select name="type" required><option value="">선택하세요</option><option value="COUPLE">커플 여행</option><option value="SOLO">혼자 여행</option><option value="FAMILY">가족 여행</option><option value="FRIENDS">친구 여행</option><option value="OTHER">기타</option></select></label>
          <button class="primary search-submit" type="submit"><span class="search-icon" aria-hidden="true"></span> 여행 검색</button>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </div>
  <section class="container home-extra" aria-labelledby="destinations-heading">
    <div class="panel-heading"><div><h2 id="destinations-heading">전국 시·도</h2><p>시·도를 선택하면 대표 지점을 사용합니다. 정확한 주소나 장소는 위에서 찾을 수 있습니다.</p></div></div>
    <div id="catalog" class="city-grid"></div>
  </section>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
