<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('여행 검색')}"></head>
<body class="redesign home-screen" data-page="home">
<header th:replace="~{layout :: header('home')}"></header>
<main id="main" class="container home-content">
    <section class="panel search-panel" aria-labelledby="search-heading">
      <div class="home-heading">
        <h1 id="search-heading">여행 조건</h1>
        <p id="trip-place-hint">장소명이나 주소를 입력하고 Enter를 눌러 검색하세요.</p>
      </div>
      <form id="trip-form">
        <div class="place-grid">
          <div class="trip-place">
            <label for="trip-origin">출발지</label>
            <input id="trip-origin" name="origin" list="city-list" placeholder="장소명 또는 주소" enterkeyhint="search"
                   required maxlength="160" autocomplete="off" aria-describedby="trip-place-hint origin-place-status">
            <p class="place-status" id="origin-place-status" role="status"></p>
            <ul class="place-results" id="origin-place-results" hidden></ul>
          </div>
          <div class="trip-place">
            <label for="trip-destination">목적지</label>
            <input id="trip-destination" name="destination" list="city-list" placeholder="장소명 또는 주소" enterkeyhint="search"
                   required maxlength="160" autocomplete="off" aria-describedby="trip-place-hint destination-place-status">
            <p class="place-status" id="destination-place-status" role="status"></p>
            <ul class="place-results" id="destination-place-results" hidden></ul>
          </div>
        </div>
        <div class="trip-pair">
          <label>여행 시작일<input type="date" name="start" required></label>
          <label>여행 종료일<input type="date" name="end" required></label>
        </div>
        <div class="trip-pair">
          <label>성인 (명)<input name="adults" type="number" min="1" max="30" required></label>
          <label>아동 (명)<input name="children" type="number" value="0" min="0" max="30" required></label>
        </div>
        <datalist id="city-list"></datalist>
        <button class="primary search-submit" type="submit">여행 검색</button>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </form>
    </section>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
