<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('일일투어')}"></head>
<body data-page="tours">
<header th:replace="~{layout :: header('tours')}"></header>
<main id="main">

  <div class="container workspace">
    <div id="trip-summary" class="trip-summary" hidden></div>
    <div class="page-title"><span class="eyebrow">현지 체험</span><h1>일일투어 둘러보기</h1><p>방문 장소와 포함 비용을 확인하고 자유여행과 비교할 투어를 선택하세요.</p></div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    
    <div class="actions page-actions"><a class="soft" href="/itinerary">여행 일정</a></div>
    <form id="tour-search" class="panel section filter-bar">
      <label>여행지<select name="destination" required></select></label>
      <label>투어 날짜<input name="date" type="date"></label>
      <label>판매 플랫폼<select name="platform"><option value="">전체 플랫폼</option><option value="KLOOK">클룩</option><option value="MYREALTRIP">마이리얼트립</option><option value="NOL">NOL / 야놀자</option><option value="KKDAY">KKday</option><option value="OTHER">기타</option></select></label>
      <button class="primary">투어 검색</button>
    </form>
    <div id="tour-shortlist"></div>
    <div id="tour-list" class="tour-list"></div>
  </div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
